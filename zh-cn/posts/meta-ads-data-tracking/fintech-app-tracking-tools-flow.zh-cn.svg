<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc">
  <title id="title">Fintech App 中 Pixel、App SDK、MMP 与 CAPI 的数据流转</title>
  <desc id="desc">Meta 广告将用户带到网站落地页或应用商店。网站事件经 Google Tag Manager 分发给 Meta Pixel 和 Google Analytics。App 事件可以经 Meta App Events SDK 发给 Meta，经 AppsFlyer SDK 发给 AppsFlyer，或经 Firebase SDK 发给 Google Analytics。KYC、入金和交易由业务后端确认，再经 CAPI 发给 Meta、经 Server-to-Server 发给 AppsFlyer，并进入内部数据平台。</desc>
  <defs>
    <style>
      .eyebrow{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.12em;fill:#6558d6}
      .title{font:750 34px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#202126}
      .subtitle{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#686b73}
      .column{font:750 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.08em;fill:#6d7078}
      .lane{font:750 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.06em;fill:#6d7078}
      .node{font:750 17px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#292b30}
      .node-small{font:650 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#676a72}
      .platform{font:750 21px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#27292e}
      .platform-sub{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#5f626a}
      .label{font:650 12px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#696c74}
      .legend{font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#686b73}
      .flow{fill:none;stroke:#8a8d95;stroke-width:2.4;marker-end:url(#arrow)}
      .meta-flow{fill:none;stroke:#6c5fd7;stroke-width:2.6;marker-end:url(#arrow-meta)}
      .google-flow{fill:none;stroke:#3f86a5;stroke-width:2.6;marker-end:url(#arrow-google)}
      .mmp-flow{fill:none;stroke:#3b9671;stroke-width:2.6;marker-end:url(#arrow-mmp)}
      .internal-flow{fill:none;stroke:#c37b3e;stroke-width:2.6;marker-end:url(#arrow-internal)}
      .integration{fill:none;stroke:#8f839e;stroke-width:2;stroke-dasharray:7 7;marker-start:url(#arrow-integration-start);marker-end:url(#arrow-integration)}
    </style>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#302d4f" flood-opacity=".08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#8a8d95"/></marker>
    <marker id="arrow-meta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#6c5fd7"/></marker>
    <marker id="arrow-google" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#3f86a5"/></marker>
    <marker id="arrow-mmp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#3b9671"/></marker>
    <marker id="arrow-internal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#c37b3e"/></marker>
    <marker id="arrow-integration" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#8f839e"/></marker>
    <marker id="arrow-integration-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 0 5 10 10z" fill="#8f839e"/></marker>
  </defs>

  <rect width="1440" height="1120" rx="28" fill="#faf9f6"/>
  <text x="64" y="65" class="eyebrow">FINTECH APP · TRACKING STACK</text>
  <text x="64" y="112" class="title">四类工具如何连接用户行为与广告系统</text>
  <text x="64" y="146" class="subtitle">同一段用户旅程，会按发生环境与 Source of Truth 进入不同的数据路径</text>

  <g transform="translate(835 75)">
    <path d="M0 0H42" class="meta-flow"/><text x="53" y="5" class="legend">发送至 Meta</text>
    <path d="M160 0H202" class="mmp-flow"/><text x="213" y="5" class="legend">发送至 MMP</text>
    <path d="M320 0H362" class="google-flow"/><text x="373" y="5" class="legend">发送至 GA4</text>
    <path d="M0 34H42" class="integration"/><text x="53" y="39" class="legend">平台集成</text>
  </g>

  <text x="204" y="205" text-anchor="middle" class="column">用户触点与数据源</text>
  <text x="705" y="205" text-anchor="middle" class="column">采集与传输</text>
  <text x="1220" y="205" text-anchor="middle" class="column">平台与数据用途</text>
  <line x1="402" y1="188" x2="402" y2="1042" stroke="#e0ddd6" stroke-width="1.5"/>
  <line x1="1010" y1="188" x2="1010" y2="1042" stroke="#e0ddd6" stroke-width="1.5"/>

  <!-- User journey / sources -->
  <g filter="url(#shadow)">
    <rect x="74" y="240" width="270" height="78" rx="17" fill="#eeeaff" stroke="#d7d0fa"/>
    <rect x="74" y="362" width="270" height="78" rx="17" fill="#f3f1ec" stroke="#dfdcd4"/>
    <rect x="74" y="484" width="270" height="78" rx="17" fill="#f3f1ec" stroke="#dfdcd4"/>
    <rect x="74" y="606" width="270" height="90" rx="17" fill="#e5f1f8" stroke="#c8dfec"/>
    <rect x="74" y="805" width="270" height="122" rx="17" fill="#f8ead9" stroke="#edd5b8"/>
  </g>
  <text x="104" y="274" class="node">Meta 广告</text><text x="104" y="297" class="node-small">Impression / Click</text>
  <text x="104" y="396" class="node">网站落地页</text><text x="104" y="419" class="node-small">PageView · CTA Click</text>
  <text x="104" y="518" class="node">App Store / Google Play</text><text x="104" y="541" class="node-small">Store Visit</text>
  <text x="104" y="642" class="node">Fintech App</text><text x="104" y="665" class="node-small">Install · Registration · App Behavior</text>
  <text x="104" y="840" class="node">业务后端系统</text>
  <text x="104" y="865" class="node-small">KYC · 支付 / 资金 · 交易</text>
  <text x="104" y="889" class="node-small">确认完成状态、金额与收入</text>

  <!-- Acquisition journey -->
  <path d="M209 318V350" class="flow"/>
  <path d="M344 279C378 279 378 523 344 523" class="flow"/>
  <path d="M209 562V594" class="flow"/>
  <path d="M209 696V793" class="flow"/>
  <text x="228" y="345" class="label">Web 路径</text>
  <text x="357" y="472" class="label">App 路径</text>
  <text x="228" y="752" class="label">深层业务结果</text>

  <!-- Web lane -->
  <text x="438" y="262" class="lane">WEB EVENT</text>
  <rect x="448" y="285" width="238" height="72" rx="15" fill="#eaf2f7" stroke="#cbdde8"/>
  <text x="472" y="315" class="node">Google Tag Manager</text><text x="472" y="338" class="node-small">Tag · Trigger · Data Layer</text>
  <rect x="758" y="285" width="206" height="72" rx="15" fill="#eeeaff" stroke="#d7d0fa"/>
  <text x="782" y="315" class="node">Meta Pixel</text><text x="782" y="338" class="node-small">浏览器 Event</text>
  <path d="M344 401C390 401 390 321 448 321" class="flow"/>
  <path d="M686 321H746" class="meta-flow"/>

  <!-- App lane -->
  <text x="438" y="424" class="lane">APP EVENT</text>
  <rect x="448" y="447" width="238" height="68" rx="15" fill="#eeeaff" stroke="#d7d0fa"/>
  <text x="472" y="475" class="node">Meta App Events SDK</text><text x="472" y="497" class="node-small">可选的 Meta 直连路径</text>
  <rect x="448" y="535" width="238" height="68" rx="15" fill="#e8f5ee" stroke="#c9e4d5"/>
  <text x="472" y="563" class="node">AppsFlyer SDK</text><text x="472" y="585" class="node-small">Install · Post-install Event</text>
  <rect x="448" y="623" width="238" height="68" rx="15" fill="#e5f1f8" stroke="#c8dfec"/>
  <text x="472" y="651" class="node">Firebase SDK</text><text x="472" y="673" class="node-small">App 行为分析</text>
  <path d="M344 651C394 651 394 481 448 481" class="meta-flow"/>
  <path d="M344 651H436" class="mmp-flow"/>
  <path d="M344 651C394 651 394 657 448 657" class="google-flow"/>

  <!-- Backend lane -->
  <text x="438" y="763" class="lane">SERVER EVENT</text>
  <rect x="448" y="786" width="238" height="68" rx="15" fill="#f8ead9" stroke="#edd5b8"/>
  <text x="472" y="814" class="node">Event Source</text><text x="472" y="836" class="node-small">业务后端确认 Event</text>
  <rect x="758" y="754" width="206" height="68" rx="15" fill="#eeeaff" stroke="#d7d0fa"/>
  <text x="782" y="782" class="node">CAPI</text><text x="782" y="804" class="node-small">Server → Meta</text>
  <rect x="758" y="852" width="206" height="68" rx="15" fill="#e8f5ee" stroke="#c9e4d5"/>
  <text x="782" y="880" class="node">AppsFlyer S2S</text><text x="782" y="902" class="node-small">Server → MMP</text>
  <path d="M344 866H436" class="internal-flow"/>
  <path d="M686 820C720 820 720 788 758 788" class="meta-flow"/>
  <path d="M686 820C720 820 720 886 758 886" class="mmp-flow"/>

  <!-- Destinations -->
  <g filter="url(#shadow)">
    <rect x="1060" y="244" width="306" height="232" rx="20" fill="#eeeaff" stroke="#d7d0fa" stroke-width="1.5"/>
    <rect x="1060" y="530" width="306" height="144" rx="20" fill="#e8f5ee" stroke="#c9e4d5" stroke-width="1.5"/>
    <rect x="1060" y="724" width="306" height="128" rx="20" fill="#e5f1f8" stroke="#c8dfec" stroke-width="1.5"/>
    <rect x="1060" y="902" width="306" height="128" rx="20" fill="#f8ead9" stroke="#edd5b8" stroke-width="1.5"/>
  </g>
  <text x="1090" y="282" class="platform">Meta</text>
  <text x="1090" y="311" class="platform-sub">Events Manager · Ads Manager</text>
  <rect x="1090" y="337" width="246" height="48" rx="12" fill="#fff" fill-opacity=".82"/><text x="1110" y="367" class="node-small">广告优化与 Attribution</text>
  <rect x="1090" y="397" width="246" height="48" rx="12" fill="#fff" fill-opacity=".82"/><text x="1110" y="427" class="node-small">接收选定的 Optimization Signal</text>

  <text x="1090" y="568" class="platform">AppsFlyer · MMP</text>
  <text x="1090" y="597" class="platform-sub">跨渠道移动归因</text>
  <text x="1090" y="628" class="node-small">Install · Post-install Event · Postback</text>

  <text x="1090" y="762" class="platform">Google Analytics 4</text>
  <text x="1090" y="791" class="platform-sub">Web 与 App 行为分析</text>
  <text x="1090" y="822" class="node-small">独立的用户行为分析口径</text>

  <text x="1090" y="940" class="platform">内部数据平台</text>
  <text x="1090" y="969" class="platform-sub">业务验证与 Source of Truth</text>
  <text x="1090" y="1000" class="node-small">CAC · Retention · Contribution LTV</text>

  <!-- Platform flows -->
  <path d="M964 321H1048" class="meta-flow"/>
  <path d="M686 481C905 481 940 400 1048 400" class="meta-flow"/>
  <path d="M964 788C1014 788 1014 432 1048 432" class="meta-flow"/>
  <path d="M686 569C850 569 918 602 1048 602" class="mmp-flow"/>
  <path d="M964 886C1015 886 1015 640 1048 640" class="mmp-flow"/>
  <path d="M686 657C864 657 928 788 1048 788" class="google-flow"/>
  <path d="M686 820C900 820 930 966 1048 966" class="internal-flow"/>
  <path d="M1212 488V518" class="integration"/>
  <text x="1228" y="510" class="label">Partner Integration</text>

  <!-- Bottom decision note -->
  <rect x="74" y="1060" width="1292" height="1" fill="#dedbd4"/>
  <text x="74" y="1092" class="node-small">设计原则：一个 Event 应有明确的 Source of Truth、发送路径和验收报表；虚线表示 Meta 与 MMP 的平台集成关系。</text>
</svg>
