<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">三个 Fintech App Campaign 的单位经济对比</title>
  <desc id="desc">Campaign A、B、C 的 CPI、Cost per KYC Complete、Cost per First Transaction、D90 Contribution LTV 和回本周期对比。Campaign A 的 CPI 最低，但最终获客成本最高；Campaign C 的 CPI 最高，但最终获客成本最低、D90 Contribution LTV 最高且回本最快。Target CAC 为 120 美元。</desc>
  <defs>
    <style>
      .eyebrow{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.12em;fill:#6558d6}
      .title{font:750 34px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#202126}
      .subtitle{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#686b73}
      .header{font:750 20px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#26282d}
      .header-note{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#6b6e77}
      .metric{font:650 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#34363c}
      .metric-note{font:500 12px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#777a82}
      .value{font:750 22px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#2b2d32}
      .value-good{font:750 22px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#267956}
      .value-bad{font:750 22px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#b44b4b}
      .tag{font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.05em}
      .axis{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#747780}
      .takeaway{font:650 17px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#41434a}
      .grid{stroke:#e5e3de;stroke-width:1.5}
      .cell{fill:#fff}
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="11" flood-color="#302d4f" flood-opacity=".09"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#888b93"/>
    </marker>
  </defs>

  <rect width="1280" height="900" rx="28" fill="#faf9f6"/>
  <text x="72" y="70" class="eyebrow">UNIT ECONOMICS · CAMPAIGN COHORT</text>
  <text x="72" y="117" class="title">浅层成本最低，不一定带来更低的最终 CAC</text>
  <text x="72" y="151" class="subtitle">从 CPI 一直观察到 First Transaction、D90 Contribution LTV 与回本周期</text>

  <rect x="1010" y="72" width="198" height="58" rx="12" fill="#f0eef9" stroke="#dcd7f4"/>
  <text x="1109" y="96" text-anchor="middle" class="metric-note">TARGET CAC</text>
  <text x="1109" y="119" text-anchor="middle" class="header">≤ $120</text>

  <g filter="url(#shadow)">
    <rect x="118" y="200" width="1090" height="572" rx="18" fill="#fff"/>
  </g>

  <!-- Column headers -->
  <rect x="118" y="200" width="258" height="104" rx="18" fill="#f3f1ec"/>
  <text x="150" y="243" class="header">衡量指标</text>
  <text x="150" y="270" class="header-note">同一归因口径与 Cohort 窗口</text>

  <rect x="376" y="200" width="277" height="104" fill="#f0edff"/>
  <text x="514.5" y="238" text-anchor="middle" class="header">Campaign A</text>
  <text x="514.5" y="264" text-anchor="middle" class="header-note">低价安装导向</text>
  <rect x="471" y="275" width="87" height="22" rx="11" fill="#e1dcff"/>
  <text x="514.5" y="290" text-anchor="middle" class="tag" fill="#5f52c8">LOW CPI</text>

  <rect x="653" y="200" width="277" height="104" fill="#eaf3f9"/>
  <text x="791.5" y="238" text-anchor="middle" class="header">Campaign B</text>
  <text x="791.5" y="264" text-anchor="middle" class="header-note">平衡型流量</text>

  <path d="M930 200h260a18 18 0 0 1 18 18v86H930z" fill="#e8f5ee"/>
  <text x="1069" y="238" text-anchor="middle" class="header">Campaign C</text>
  <text x="1069" y="264" text-anchor="middle" class="header-note">高意向用户导向</text>
  <rect x="1010" y="275" width="118" height="22" rx="11" fill="#d3eddf"/>
  <text x="1069" y="290" text-anchor="middle" class="tag" fill="#267956">BEST VALUE</text>

  <!-- Row backgrounds -->
  <rect x="118" y="304" width="1090" height="92" fill="#faf9f7"/>
  <rect x="118" y="396" width="1090" height="92" fill="#fff"/>
  <rect x="118" y="488" width="1090" height="98" fill="#faf9f7"/>
  <rect x="118" y="586" width="1090" height="92" fill="#fff"/>
  <path d="M118 678h1090v76a18 18 0 0 1-18 18H136a18 18 0 0 1-18-18z" fill="#faf9f7"/>

  <!-- Grid -->
  <line x1="376" y1="304" x2="376" y2="772" class="grid"/>
  <line x1="653" y1="200" x2="653" y2="772" class="grid"/>
  <line x1="930" y1="200" x2="930" y2="772" class="grid"/>
  <line x1="118" y1="304" x2="1208" y2="304" class="grid"/>
  <line x1="118" y1="396" x2="1208" y2="396" class="grid"/>
  <line x1="118" y1="488" x2="1208" y2="488" class="grid"/>
  <line x1="118" y1="586" x2="1208" y2="586" class="grid"/>
  <line x1="118" y1="678" x2="1208" y2="678" class="grid"/>

  <!-- Metric labels -->
  <text x="150" y="342" class="metric">CPI</text>
  <text x="150" y="365" class="metric-note">Cost per Install</text>
  <text x="150" y="434" class="metric">Cost per KYC Complete</text>
  <text x="150" y="457" class="metric-note">更深一层的用户质量</text>
  <text x="150" y="527" class="metric">Cost per First Transaction</text>
  <text x="150" y="550" class="metric-note">本文定义的 Media CAC</text>
  <text x="150" y="624" class="metric">D90 Contribution LTV</text>
  <text x="150" y="647" class="metric-note">获客后 90 天贡献价值</text>
  <text x="150" y="718" class="metric">回本周期</text>
  <text x="150" y="741" class="metric-note">Contribution LTV 覆盖 CAC</text>

  <!-- Campaign A -->
  <text x="514.5" y="360" text-anchor="middle" class="value-good">$3.80</text>
  <text x="514.5" y="452" text-anchor="middle" class="value">$29</text>
  <rect x="459" y="507" width="111" height="48" rx="10" fill="#fbeaea"/>
  <text x="514.5" y="539" text-anchor="middle" class="value-bad">$148</text>
  <text x="514.5" y="642" text-anchor="middle" class="value">$34</text>
  <text x="514.5" y="734" text-anchor="middle" class="value-bad">&gt; 15 个月</text>

  <!-- Campaign B -->
  <text x="791.5" y="360" text-anchor="middle" class="value">$5.20</text>
  <text x="791.5" y="452" text-anchor="middle" class="value">$26</text>
  <text x="791.5" y="539" text-anchor="middle" class="value">$108</text>
  <text x="791.5" y="642" text-anchor="middle" class="value">$51</text>
  <text x="791.5" y="734" text-anchor="middle" class="value">8 个月</text>

  <!-- Campaign C -->
  <text x="1069" y="360" text-anchor="middle" class="value">$6.40</text>
  <text x="1069" y="452" text-anchor="middle" class="value-good">$24</text>
  <rect x="1018" y="507" width="102" height="48" rx="10" fill="#e2f3e9"/>
  <text x="1069" y="539" text-anchor="middle" class="value-good">$92</text>
  <text x="1069" y="642" text-anchor="middle" class="value-good">$68</text>
  <text x="1069" y="734" text-anchor="middle" class="value-good">5 个月</text>

  <!-- Business-value direction -->
  <path d="M79 323v414" fill="none" stroke="#888b93" stroke-width="2" stroke-dasharray="6 7" marker-end="url(#arrow)"/>
  <text x="50" y="530" text-anchor="middle" class="axis" transform="rotate(-90 50 530)">越往下，越接近最终业务价值</text>

  <rect x="118" y="810" width="1090" height="54" rx="13" fill="#f0efe9"/>
  <text x="663" y="843" text-anchor="middle" class="takeaway">Campaign A 赢得了 CPI，却在最终 CAC、D90 价值和回本速度上落后。</text>
</svg>
