<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" role="img" aria-labelledby="title desc">
  <title id="title">Meta Budget, Bid Strategy, and Pacing</title>
  <desc id="desc">Performance Goal, Bid Strategy, and Budget feed into pacing, which selects auctions using remaining budget, time, and predicted value. Simulated data shows budget rising from $100 to $200, KYC completions from 5 to 8, Average CPA from $20 to $25, and Marginal CPA of $33.33.</desc>
  <defs>
    <style>
      .eyebrow{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.12em;fill:#6558d6}
      .title{font:750 34px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#202126}
      .subtitle{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#686b73}
      .section{font:750 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.08em;fill:#777982}
      .card-title{font:750 17px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#303238}
      .card-text{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#6d7078}
      .value{font:750 23px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#5549b5}
      .engine-title{font:750 24px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#fff}
      .engine-sub{font:550 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#e9e6ff}
      .engine-pill{font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#5549b5}
      .timeline{font:650 12px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#666a72}
      .metric-label{font:650 12px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#72757d}
      .metric-value{font:750 21px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#303238}
      .metric-value-green{font:750 21px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#2e7b57}
      .small{font:550 12px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#74777e}
      .bottom-label{font:750 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.06em;fill:#a4662f}
      .bottom-title{font:750 22px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#3b3c41}
      .formula{font:700 18px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#6c4a2e}
      .conclusion{font:750 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#7d4e26}
      .arrow{fill:none;stroke:#8a82cb;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="145%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#302d4f" flood-opacity=".09"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#8a82cb"/>
    </marker>
  </defs>

  <rect width="1280" height="960" rx="28" fill="#faf9f6"/>
  <text x="64" y="60" class="eyebrow">META ADS · BUDGET &amp; PACING</text>
  <text x="64" y="106" class="title">How Budget Becomes Spend and Results</text>
  <text x="64" y="139" class="subtitle">The goal defines success, bidding sets conditions, budget provides resources, and pacing selects auctions</text>
  <rect x="1043" y="52" width="173" height="34" rx="17" fill="#eeeaff" stroke="#d7d0fa"/>
  <text x="1129" y="74" text-anchor="middle" class="card-text" fill="#5549b5">SIMULATED · KYC COMPLETE</text>

  <!-- Column headings -->
  <text x="64" y="194" class="section">01 · THREE CAMPAIGN INPUTS</text>
  <text x="452" y="194" class="section">02 · PACING DECISIONS</text>
  <text x="866" y="194" class="section">03 · DELIVERY OUTCOMES</text>

  <!-- Inputs -->
  <g filter="url(#shadow)">
    <rect x="64" y="214" width="330" height="118" rx="19" fill="#fff" stroke="#ddd8f5"/>
    <rect x="64" y="350" width="330" height="118" rx="19" fill="#fff" stroke="#ddd8f5"/>
    <rect x="64" y="486" width="330" height="118" rx="19" fill="#fff" stroke="#ddd8f5"/>
  </g>
  <circle cx="96" cy="248" r="13" fill="#6558d6"/>
  <text x="121" y="253" class="card-title">Performance Goal</text>
  <text x="91" y="284" class="value">KYC Complete</text>
  <text x="91" y="308" class="card-text">The optimization event to acquire</text>

  <circle cx="96" cy="384" r="13" fill="#397fa5"/>
  <text x="121" y="389" class="card-title">Bid Strategy</text>
  <text x="91" y="420" class="value" fill="#397fa5">Highest Volume</text>
  <text x="91" y="444" class="card-text">Defines auction participation</text>

  <circle cx="96" cy="520" r="13" fill="#3d9469"/>
  <text x="121" y="525" class="card-title">Daily Budget</text>
  <text x="91" y="557" class="value" fill="#2e7b57">$100 → $200</text>
  <text x="91" y="581" class="card-text">Resource limit increases 100%</text>

  <!-- Arrows to engine -->
  <path d="M394 273C422 273 424 305 449 320" class="arrow"/>
  <path d="M394 409H449" class="arrow"/>
  <path d="M394 545C422 545 424 513 449 498" class="arrow"/>

  <!-- Pacing engine -->
  <g filter="url(#shadow)">
    <rect x="462" y="214" width="346" height="390" rx="25" fill="#6558d6"/>
  </g>
  <text x="635" y="260" text-anchor="middle" class="engine-title">Pacing</text>
  <text x="635" y="284" text-anchor="middle" class="engine-sub">Updates participation throughout delivery</text>

  <rect x="492" y="311" width="132" height="36" rx="12" fill="#fff" fill-opacity=".94"/>
  <rect x="646" y="311" width="132" height="36" rx="12" fill="#fff" fill-opacity=".94"/>
  <rect x="492" y="359" width="132" height="36" rx="12" fill="#fff" fill-opacity=".94"/>
  <rect x="646" y="359" width="132" height="36" rx="12" fill="#fff" fill-opacity=".94"/>
  <text x="558" y="334" text-anchor="middle" class="engine-pill">Budget left</text>
  <text x="712" y="334" text-anchor="middle" class="engine-pill">Time left</text>
  <text x="558" y="382" text-anchor="middle" class="engine-pill">Predicted value</text>
  <text x="712" y="382" text-anchor="middle" class="engine-pill">Bid Strategy</text>

  <text x="635" y="431" text-anchor="middle" class="engine-sub">Select current auctions while reserving budget</text>
  <line x1="505" y1="475" x2="765" y2="475" stroke="#b5aef0" stroke-width="3" stroke-linecap="round"/>
  <g>
    <circle cx="520" cy="475" r="10" fill="#77c29b" stroke="#fff" stroke-width="2"/>
    <circle cx="570" cy="475" r="10" fill="#a9a2d7" stroke="#d9d5f6" stroke-width="2"/>
    <circle cx="620" cy="475" r="10" fill="#77c29b" stroke="#fff" stroke-width="2"/>
    <circle cx="670" cy="475" r="10" fill="#f0b56f" stroke="#fff" stroke-width="2"/>
    <circle cx="720" cy="475" r="10" fill="#a9a2d7" stroke="#d9d5f6" stroke-width="2"/>
    <circle cx="750" cy="475" r="10" fill="#f0b56f" stroke="#fff" stroke-width="2"/>
  </g>
  <text x="520" y="505" text-anchor="middle" class="engine-sub">Enter</text>
  <text x="570" y="505" text-anchor="middle" class="engine-sub">Skip</text>
  <text x="620" y="505" text-anchor="middle" class="engine-sub">Enter</text>
  <text x="710" y="505" text-anchor="middle" class="engine-sub">New marginal opportunities</text>
  <rect x="505" y="538" width="260" height="40" rx="13" fill="#5549b5" stroke="#9389e6"/>
  <text x="635" y="563" text-anchor="middle" class="engine-sub">More budget expands acceptable opportunities</text>

  <!-- Arrow to outputs -->
  <path d="M808 409H851" class="arrow"/>

  <!-- Results -->
  <g filter="url(#shadow)">
    <rect x="866" y="214" width="350" height="178" rx="21" fill="#fff" stroke="#dedbe8"/>
    <rect x="866" y="410" width="350" height="194" rx="21" fill="#e8f5ee" stroke="#b9dbc8"/>
  </g>
  <text x="894" y="248" class="card-title">Before Scaling · Baseline</text>
  <rect x="1092" y="229" width="96" height="28" rx="14" fill="#f0eee8"/>
  <text x="1140" y="248" text-anchor="middle" class="small">Budget $100</text>
  <text x="894" y="289" class="metric-label">SPEND</text>
  <text x="1008" y="289" class="metric-label">RESULTS</text>
  <text x="1110" y="289" class="metric-label">AVG. CPA</text>
  <text x="894" y="323" class="metric-value">$100</text>
  <text x="1008" y="323" class="metric-value">5</text>
  <text x="1110" y="323" class="metric-value">$20</text>
  <text x="894" y="358" class="small">5 KYC Completions × $20</text>

  <text x="894" y="446" class="card-title" fill="#286f50">After Scaling · Scaled</text>
  <rect x="1092" y="427" width="96" height="28" rx="14" fill="#fff" fill-opacity=".8"/>
  <text x="1140" y="446" text-anchor="middle" class="small">Budget $200</text>
  <text x="894" y="489" class="metric-label">SPEND</text>
  <text x="1008" y="489" class="metric-label">RESULTS</text>
  <text x="1110" y="489" class="metric-label">AVG. CPA</text>
  <text x="894" y="523" class="metric-value-green">$200</text>
  <text x="1008" y="523" class="metric-value-green">8</text>
  <text x="1110" y="523" class="metric-value-green">$25</text>
  <rect x="894" y="548" width="130" height="32" rx="16" fill="#fff" fill-opacity=".82"/>
  <rect x="1038" y="548" width="150" height="32" rx="16" fill="#fff" fill-opacity=".82"/>
  <text x="959" y="569" text-anchor="middle" class="small" fill="#286f50">Budget +100%</text>
  <text x="1113" y="569" text-anchor="middle" class="small" fill="#286f50">Results +60%</text>

  <!-- Bottom explanation -->
  <g filter="url(#shadow)">
    <rect x="64" y="652" width="1152" height="244" rx="24" fill="#fbefe1" stroke="#e8cda9"/>
  </g>
  <text x="94" y="692" class="bottom-label">MARGINAL CPA · NEW BUDGET BUYS MARGINAL OPPORTUNITIES</text>
  <text x="94" y="728" class="bottom-title">The 3 additional results explain the higher average cost</text>

  <rect x="94" y="758" width="304" height="82" rx="17" fill="#fff" fill-opacity=".8" stroke="#ead8c1"/>
  <text x="116" y="786" class="card-title">Original results</text>
  <text x="116" y="817" class="formula">$100 ÷ 5 = $20</text>

  <path d="M414 799H465" fill="none" stroke="#c58b53" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="482" y="758" width="342" height="82" rx="17" fill="#fff7ed" stroke="#dca96e" stroke-width="1.5"/>
  <text x="504" y="786" class="card-title">Additional results · Marginal CPA</text>
  <text x="504" y="817" class="formula">$100 ÷ 3 = $33.33</text>

  <path d="M840 799H891" fill="none" stroke="#c58b53" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="908" y="758" width="278" height="82" rx="17" fill="#fff" fill-opacity=".8" stroke="#ead8c1"/>
  <text x="930" y="786" class="card-title">New overall average</text>
  <text x="930" y="817" class="formula">$200 ÷ 8 = $25</text>

  <rect x="94" y="856" width="1092" height="24" rx="12" fill="#f3dcc2"/>
  <text x="640" y="873" text-anchor="middle" class="conclusion">Results rise by 3, but their $33.33 Marginal CPA exceeds the old $20 average, lifting Average CPA to $25</text>

  <text x="1216" y="930" text-anchor="end" class="small">Illustrative data only; not representative of any real account</text>
</svg>
