<svg xmlns="http://www.w3.org/2000/svg" width="360" height="690" viewBox="0 0 360 690" role="img" aria-labelledby="title desc">
  <title id="title">The state flow of a live timer</title>
  <desc id="desc">After choosing a focus area and starting a timer, an entry becomes active. It can be paused and resumed. A completed entry counts toward totals and trends; a cancelled entry does not.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8b8796"/></marker>
    <style>.label{font:650 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#202126}.small{font:500 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#6f7179}.action{font:700 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#6657d9;letter-spacing:.02em}.line{fill:none;stroke:#8b8796;stroke-width:2;marker-end:url(#arrow)}.card{fill:#fff;stroke:#e8e6e1;stroke-width:1.5}.active{fill:#eeebff;stroke:#6657d9;stroke-width:1.7}.done{fill:#edf8f2;stroke:#4da87b;stroke-width:1.7}.quiet{fill:#faf9f6;stroke:#d8d5ce;stroke-width:1.5}</style>
  </defs>
  <rect width="360" height="690" rx="20" fill="#faf9f6"/>
  <text x="22" y="34" class="small" style="font-weight:700;letter-spacing:.08em;fill:#6657d9">A LIVE TIMER</text>
  <text x="22" y="61" class="label" style="font-size:20px">From Start to a completed entry</text>
  <rect x="38" y="88" width="284" height="62" rx="13" class="card"/><text x="180" y="114" text-anchor="middle" class="label">Choose a focus area</text><text x="180" y="136" text-anchor="middle" class="small">Start creates a new entry</text><path d="M180 150v26" class="line"/>
  <rect x="38" y="178" width="284" height="68" rx="13" class="active"/><text x="180" y="206" text-anchor="middle" class="label">Running</text><text x="180" y="228" text-anchor="middle" class="small">Continuously calculates active time</text>
  <path d="M164 246v37" class="line"/><path d="M196 284v-36" class="line"/><text x="207" y="270" class="action">PAUSE / RESUME</text><rect x="38" y="286" width="284" height="62" rx="13" class="quiet"/><text x="180" y="312" text-anchor="middle" class="label">Paused</text><text x="180" y="334" text-anchor="middle" class="small">Pause intervals are excluded</text>
  <text x="180" y="382" text-anchor="middle" class="small">Finish from either Running or Paused</text><path d="M180 348v20" class="line"/>
  <rect x="38" y="402" width="284" height="100" rx="13" class="done"/><text x="180" y="429" text-anchor="middle" class="action">FINISH</text><text x="180" y="454" text-anchor="middle" class="label">Review task and duration</text><text x="180" y="477" text-anchor="middle" class="small">Completed: included in totals and trends</text>
  <text x="180" y="530" text-anchor="middle" class="small">or</text><rect x="38" y="550" width="284" height="78" rx="13" class="quiet"/><text x="180" y="577" text-anchor="middle" class="action">CANCEL</text><text x="180" y="602" text-anchor="middle" class="label">Cancelled: excluded from totals</text>
  <circle cx="24" cy="659" r="4" fill="#4da87b"/><text x="36" y="664" class="small">Only Completed entries appear in statistics</text>
</svg>
