<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">Fintech app funnel from ad touchpoint to long-term business value</title>
  <desc id="desc">A four-stage funnel covering Acquisition, Activation, Monetization, and Retention. Event volume generally decreases and feedback slows deeper in the funnel, while the relationship with business value strengthens.</desc>
  <defs><style>
    .eye{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.14em;fill:#6558d6}.title{font:750 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#202126}.sub{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#686b73}.stage{font:750 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#282a2f}.stage-sub{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#62656d}.event{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#303238}.note{font:500 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#6d7078}.source{font:650 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#4a4d54}.foot{font:650 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#4b4d54}
  </style><filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity=".08"/></filter><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#858891"/></marker></defs>
  <rect width="1280" height="900" rx="28" fill="#faf9f6"/>
  <text x="72" y="70" class="eye">CONCEPTUAL FUNNEL · FINTECH APP</text><text x="72" y="117" class="title">From ad touchpoint to long-term business value</text><text x="72" y="151" class="sub">Map event depth, data sources, and usable optimization signals across the full journey</text>
  <path d="M72 198H1208L1142 340H136Z" fill="#e9e6ff" stroke="#cfc8ff" filter="url(#s)"/><path d="M136 354H1142L1084 496H196Z" fill="#dfeff8" stroke="#bdddeb"/><path d="M196 510H1084L1020 652H260Z" fill="#e1f3e9" stroke="#bee2ce"/><path d="M260 666H1020L950 808H330Z" fill="#faead7" stroke="#efcfaa"/>
  <text x="112" y="238" class="stage">Acquisition</text><text x="112" y="263" class="stage-sub">Bring users in</text>
  <g><rect x="315" y="228" width="145" height="78" rx="14" fill="#fff" fill-opacity=".86"/><text x="388" y="260" text-anchor="middle" class="event">Ad Impression</text><text x="388" y="283" text-anchor="middle" class="note">Meta Ads</text><rect x="476" y="228" width="135" height="78" rx="14" fill="#fff" fill-opacity=".86"/><text x="544" y="260" text-anchor="middle" class="event">Ad Click</text><text x="544" y="283" text-anchor="middle" class="note">Meta Ads</text><rect x="627" y="228" width="145" height="78" rx="14" fill="#fff" fill-opacity=".86"/><text x="700" y="260" text-anchor="middle" class="event">Store Visit</text><text x="700" y="283" text-anchor="middle" class="note">App Store / Play</text><rect x="788" y="228" width="120" height="78" rx="14" fill="#fff" fill-opacity=".86"/><text x="848" y="260" text-anchor="middle" class="event">Install</text><rect x="924" y="228" width="150" height="78" rx="14" fill="#fff" fill-opacity=".86"/><text x="999" y="260" text-anchor="middle" class="event">First Open</text></g>
  <text x="206" y="396" class="stage">Activation</text><text x="206" y="421" class="stage-sub">Experience core value</text>
  <g><rect x="414" y="384" width="160" height="78" rx="14" fill="#fff" fill-opacity=".86"/><text x="494" y="419" text-anchor="middle" class="event">Registration</text><rect x="590" y="384" width="166" height="78" rx="14" fill="#fff" fill-opacity=".86"/><text x="673" y="419" text-anchor="middle" class="event">KYC Started</text><rect x="772" y="384" width="176" height="78" rx="14" fill="#fff" fill-opacity=".86"/><text x="860" y="419" text-anchor="middle" class="event">KYC Complete</text></g>
  <text x="282" y="552" class="stage">Monetization</text><text x="282" y="577" class="stage-sub">Create commercial value</text>
  <g><rect x="522" y="540" width="180" height="78" rx="14" fill="#fff" fill-opacity=".86"/><text x="612" y="575" text-anchor="middle" class="event">First Deposit</text><rect x="720" y="540" width="186" height="78" rx="14" fill="#fff" fill-opacity=".86"/><text x="813" y="575" text-anchor="middle" class="event">First Transaction</text></g>
  <text x="352" y="708" class="stage">Retention</text><text x="352" y="733" class="stage-sub">Validate lasting value</text>
  <g><rect x="562" y="696" width="182" height="78" rx="14" fill="#fff" fill-opacity=".86"/><text x="653" y="727" text-anchor="middle" class="event">Active / Repeat</text><text x="653" y="750" text-anchor="middle" class="note">Trading</text><rect x="760" y="696" width="120" height="78" rx="14" fill="#fff" fill-opacity=".86"/><text x="820" y="739" text-anchor="middle" class="event">LTV</text></g>
  <path d="M89 308C68 430 69 600 110 682" fill="none" stroke="#858891" stroke-width="2" stroke-dasharray="6 7" marker-end="url(#a)"/><text x="55" y="516" class="note" transform="rotate(-90 55 516)">Lower volume · Slower feedback</text>
  <text x="1088" y="247" class="note">COMMON SOURCES</text><text x="1088" y="273" class="source">Meta Ads</text><text x="1088" y="296" class="source">MMP / App</text><text x="960" y="403" class="note">COMMON SOURCES</text><text x="960" y="429" class="source">MMP / App</text><text x="960" y="452" class="source">Internal KYC</text><text x="922" y="559" class="note">COMMON SOURCES</text><text x="922" y="585" class="source">Payment / Trading</text><text x="888" y="715" class="note">COMMON SOURCES</text><text x="888" y="741" class="source">Data platform</text><text x="888" y="764" class="source">BI / CRM</text>
  <rect x="72" y="836" width="1136" height="43" rx="12" fill="#f0efe9"/><text x="640" y="863" text-anchor="middle" class="foot">Deeper events usually indicate more business value, but optimization still depends on volume, speed, and data quality.</text>
</svg>
