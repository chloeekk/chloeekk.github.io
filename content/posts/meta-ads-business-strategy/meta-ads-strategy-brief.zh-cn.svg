<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" role="img" aria-labelledby="title desc">
  <title id="title">Fintech App 的 Meta Ads Strategy Brief</title>
  <desc id="desc">从业务目标和增长问题出发，明确 Meta Ads 任务与目标用户，再选择 Optimization Event，以过程指标监控投放，并使用 Cost per First Transaction 和 D90 Contribution LTV 验收业务结果。Target CAC、回本周期、市场准入、广告合规和风险要求贯穿整个决策过程。</desc>
  <defs>
    <style>
      .eyebrow{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.12em;fill:#6558d6}
      .title{font:750 34px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#202126}
      .subtitle{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#686b73}
      .step{font:750 12px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.08em;fill:#6558d6}
      .card-title{font:750 20px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#25272c}
      .card-text{font:600 17px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#35373d}
      .small{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#6d7078}
      .pill{font:650 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#3d4047}
      .lane{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.06em;fill:#747780}
      .constraint-title{font:750 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#5d4fc2}
      .constraint{font:650 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#484a51}
      .arrow{fill:none;stroke:#888b93;stroke-width:2;marker-end:url(#arrowhead)}
      .connector{fill:none;stroke:#888b93;stroke-width:2}
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#312d53" flood-opacity=".09"/>
    </filter>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#888b93"/>
    </marker>
  </defs>

  <rect width="1280" height="920" rx="28" fill="#faf9f6"/>
  <text x="72" y="69" class="eyebrow">STRATEGY BRIEF · FINTECH APP</text>
  <text x="72" y="116" class="title">从业务目标到可执行的 Meta Ads 任务</text>
  <text x="72" y="150" class="subtitle">让平台设置、日常优化与最终业务价值使用同一套判断逻辑</text>

  <!-- Lane labels -->
  <text x="70" y="284" text-anchor="middle" class="lane" transform="rotate(-90 70 284)">业务决策</text>
  <text x="70" y="526" text-anchor="middle" class="lane" transform="rotate(-90 70 526)">平台执行</text>
  <text x="70" y="710" text-anchor="middle" class="lane" transform="rotate(-90 70 710)">衡量验收</text>
  <line x1="100" y1="186" x2="100" y2="382" stroke="#d6d2e8" stroke-width="3"/>
  <line x1="100" y1="410" x2="100" y2="604" stroke="#c9dfea" stroke-width="3"/>
  <line x1="100" y1="632" x2="100" y2="784" stroke="#cae3d5" stroke-width="3"/>

  <!-- Business goal -->
  <g filter="url(#shadow)">
    <rect x="138" y="184" width="1070" height="104" rx="18" fill="#eeeaff" stroke="#d8d1fb" stroke-width="1.5"/>
  </g>
  <circle cx="180" cy="220" r="20" fill="#6657d9"/>
  <text x="180" y="226" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="750" fill="#fff">1</text>
  <text x="214" y="212" class="step">业务目标</text>
  <text x="214" y="250" class="card-text">在可接受的回本周期内，增加能够贡献收入的新交易客户</text>

  <path d="M673 288v25" class="arrow"/>

  <!-- Growth problem -->
  <rect x="282" y="320" width="782" height="72" rx="15" fill="#f4f2ed" stroke="#dfdcd4" stroke-width="1.5"/>
  <text x="316" y="346" class="step" fill="#77726a">前提诊断 · 增长问题</text>
  <text x="316" y="375" class="card-text">安装量充足，KYC Complete 到 First Transaction 转化不足</text>

  <path d="M673 392v25" class="arrow"/>

  <!-- Meta Ads task -->
  <g filter="url(#shadow)">
    <rect x="138" y="424" width="1070" height="112" rx="18" fill="#e7f2f9" stroke="#c9deeb" stroke-width="1.5"/>
  </g>
  <circle cx="180" cy="461" r="20" fill="#397fa5"/>
  <text x="180" y="467" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="750" fill="#fff">2</text>
  <text x="214" y="453" class="step" fill="#397fa5">META ADS 任务</text>
  <text x="214" y="491" class="card-text">获取更可能完成首次交易的新用户</text>
  <rect x="826" y="451" width="344" height="58" rx="13" fill="#fff" fill-opacity=".82"/>
  <text x="850" y="473" class="small">目标用户</text>
  <text x="850" y="497" class="pill">允许提供服务市场中的潜在新客户</text>

  <path d="M673 536v25" class="arrow"/>

  <!-- Optimization Event -->
  <g filter="url(#shadow)">
    <rect x="236" y="568" width="874" height="104" rx="18" fill="#e7f5ed" stroke="#c9e4d5" stroke-width="1.5"/>
  </g>
  <circle cx="278" cy="604" r="20" fill="#3d9469"/>
  <text x="278" y="610" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="750" fill="#fff">3</text>
  <text x="312" y="596" class="step" fill="#3d9469">OPTIMIZATION EVENT</text>
  <text x="312" y="633" class="card-title">在事件量、回传速度和预测能力之间选择</text>
  <rect x="792" y="587" width="134" height="54" rx="12" fill="#fff" fill-opacity=".88"/>
  <text x="859" y="620" text-anchor="middle" class="pill">KYC Complete</text>
  <text x="946" y="620" text-anchor="middle" class="small">或</text>
  <rect x="975" y="587" width="109" height="54" rx="12" fill="#fff" fill-opacity=".88"/>
  <text x="1029.5" y="612" text-anchor="middle" class="pill">First</text>
  <text x="1029.5" y="630" text-anchor="middle" class="pill">Transaction</text>

  <path d="M673 672v18" class="connector"/>
  <path d="M673 690H384v17" class="arrow"/>
  <path d="M673 690h289v17" class="arrow"/>

  <!-- Measurement -->
  <g filter="url(#shadow)">
    <rect x="138" y="714" width="512" height="112" rx="18" fill="#fff" stroke="#ddd9d0" stroke-width="1.5"/>
    <rect x="696" y="714" width="512" height="112" rx="18" fill="#fff" stroke="#ddd9d0" stroke-width="1.5"/>
  </g>
  <circle cx="180" cy="750" r="20" fill="#8b8796"/>
  <text x="180" y="756" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="750" fill="#fff">4</text>
  <text x="214" y="742" class="step" fill="#77727f">过程指标 · 日常监控</text>
  <text x="214" y="779" class="card-text">Cost per KYC Complete</text>
  <text x="214" y="805" class="small">KYC Complete Rate · 回传与花费异常</text>

  <circle cx="738" cy="750" r="20" fill="#c78343"/>
  <text x="738" y="756" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="750" fill="#fff">5</text>
  <text x="772" y="742" class="step" fill="#b16f34">业务结果 · 最终验收</text>
  <text x="772" y="779" class="card-text">Cost per First Transaction</text>
  <text x="772" y="805" class="small">D90 Contribution LTV · 回本情况</text>

  <!-- Constraints -->
  <rect x="138" y="852" width="1070" height="46" rx="13" fill="#f0eef9" stroke="#ded9f3"/>
  <text x="168" y="881" class="constraint-title">约束条件贯穿所有决策</text>
  <circle cx="411" cy="875" r="3" fill="#8c82cf"/>
  <text x="425" y="881" class="constraint">Target CAC</text>
  <circle cx="538" cy="875" r="3" fill="#8c82cf"/>
  <text x="552" y="881" class="constraint">回本周期</text>
  <circle cx="657" cy="875" r="3" fill="#8c82cf"/>
  <text x="671" y="881" class="constraint">市场准入</text>
  <circle cx="776" cy="875" r="3" fill="#8c82cf"/>
  <text x="790" y="881" class="constraint">广告合规</text>
  <circle cx="895" cy="875" r="3" fill="#8c82cf"/>
  <text x="909" y="881" class="constraint">风险要求</text>
  <circle cx="1014" cy="875" r="3" fill="#8c82cf"/>
  <text x="1028" y="881" class="constraint">预算边界</text>
</svg>
