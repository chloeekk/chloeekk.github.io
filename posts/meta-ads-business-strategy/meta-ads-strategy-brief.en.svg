<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" role="img" aria-labelledby="title desc">
  <title id="title">Meta Ads Strategy Brief for a fintech app</title><desc id="desc">The brief translates a business goal and growth problem into a Meta Ads task, target users, an optimization event, process metrics, and final business outcomes, all bounded by Target CAC, Payback Period, market eligibility, compliance, and risk requirements.</desc>
  <defs><style>.eye{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.14em;fill:#6558d6}.title{font:750 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#202126}.sub{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#686b73}.num{font:750 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}.label{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.07em;fill:#6558d6}.main{font:750 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#2d3036}.small{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#5f626a}.side{font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#62656d;letter-spacing:.08em}.constraint{font:650 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#4b4e55}</style><filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity=".08"/></filter><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#8b8e96"/></marker></defs>
  <rect width="1280" height="920" rx="28" fill="#faf9f6"/><text x="72" y="69" class="eye">STRATEGY BRIEF · FINTECH APP</text><text x="72" y="116" class="title">From business goal to an executable Meta Ads task</text><text x="72" y="150" class="sub">Use one decision logic for platform settings, daily optimization, and final business value</text>
  <line x1="100" y1="187" x2="100" y2="384" stroke="#d8d1fb" stroke-width="4"/><text x="70" y="320" class="side" transform="rotate(-90 70 320)">STRATEGY</text><line x1="100" y1="410" x2="100" y2="605" stroke="#c8dfec" stroke-width="4"/><text x="70" y="548" class="side" transform="rotate(-90 70 548)">PLATFORM</text><line x1="100" y1="630" x2="100" y2="830" stroke="#c9e4d5" stroke-width="4"/><text x="70" y="770" class="side" transform="rotate(-90 70 770)">MEASUREMENT</text>
  <g filter="url(#s)"><rect x="138" y="184" width="1070" height="103" rx="18" fill="#eeeaff" stroke="#d7d0fa"/><rect x="280" y="319" width="784" height="74" rx="16" fill="#f3f1ec" stroke="#ddd9d1"/><rect x="138" y="424" width="1070" height="112" rx="18" fill="#e5f1f8" stroke="#c8dfec"/><rect x="236" y="568" width="874" height="103" rx="18" fill="#e7f5ed" stroke="#c9e4d5"/></g>
  <circle cx="180" cy="225" r="21" fill="#6558d6"/><text x="180" y="231" text-anchor="middle" class="num">1</text><text x="214" y="215" class="label">BUSINESS GOAL</text><text x="214" y="251" class="main">Add revenue-generating trading customers within an acceptable Payback Period</text>
  <path d="M673 287V307" stroke="#8b8e96" stroke-width="2" marker-end="url(#a)"/><text x="315" y="345" class="label">PREREQUISITE · GROWTH PROBLEM</text><text x="315" y="374" class="main">Install volume is sufficient; conversion from KYC Complete to First Transaction is low</text>
  <path d="M673 393V412" stroke="#8b8e96" stroke-width="2" marker-end="url(#a)"/><circle cx="180" cy="466" r="21" fill="#3b84aa"/><text x="180" y="472" text-anchor="middle" class="num">2</text><text x="214" y="457" class="label">META ADS TASK</text><text x="214" y="493" class="main">Acquire new users more likely to complete a first transaction</text>
  <rect x="826" y="451" width="342" height="58" rx="13" fill="#fff" fill-opacity=".82"/><text x="850" y="474" class="small">TARGET USERS</text><text x="850" y="497" class="main">Prospects in eligible markets</text>
  <path d="M673 536V556" stroke="#8b8e96" stroke-width="2" marker-end="url(#a)"/><circle cx="278" cy="611" r="21" fill="#3d9469"/><text x="278" y="617" text-anchor="middle" class="num">3</text><text x="312" y="601" class="label">OPTIMIZATION EVENT</text><text x="312" y="637" class="main">Balance value, volume, speed, and predictive power</text><rect x="792" y="587" width="135" height="57" rx="12" fill="#fff" fill-opacity=".86"/><text x="860" y="622" text-anchor="middle" class="small">KYC Complete</text><text x="943" y="622" class="small">or</text><rect x="976" y="587" width="110" height="57" rx="12" fill="#fff" fill-opacity=".86"/><text x="1031" y="612" text-anchor="middle" class="small">First</text><text x="1031" y="631" text-anchor="middle" class="small">Transaction</text>
  <path d="M673 671V698M673 698H383V720M673 698H963V720" fill="none" stroke="#8b8e96" stroke-width="2" marker-end="url(#a)"/><rect x="138" y="724" width="490" height="95" rx="17" fill="#eaf2f7" stroke="#c8dfec"/><text x="172" y="755" class="label">PROCESS METRICS</text><text x="172" y="786" class="main">Cost per KYC Complete · Completion Rate</text><rect x="682" y="724" width="526" height="95" rx="17" fill="#e7f5ed" stroke="#c9e4d5"/><text x="716" y="755" class="label">BUSINESS OUTCOMES</text><text x="716" y="786" class="main">Cost per First Transaction · D90 Contribution LTV</text>
  <rect x="138" y="850" width="1070" height="44" rx="12" fill="#f0efe9"/><text x="673" y="878" text-anchor="middle" class="constraint">Constraints across every decision: Target CAC · Payback Period · Market eligibility · Ad compliance · Risk requirements</text>
</svg>
