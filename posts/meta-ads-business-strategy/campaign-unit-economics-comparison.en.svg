<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">Unit economics comparison across three fintech app campaigns</title><desc id="desc">Campaign A has the lowest CPI at 3.80 dollars but the highest Cost per First Transaction at 148 dollars, above the 120-dollar Target CAC. Campaign C has the highest CPI at 6.40 dollars but the best Cost per First Transaction, D90 Contribution LTV, and payback period.</desc>
  <defs><style>.eye{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.14em;fill:#6558d6}.title{font:750 33px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#202126}.sub{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#686b73}.head{font:750 21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#292b30}.small{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#6e7179}.metric{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#373940}.value{font:750 23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#2c2e33}.good{fill:#25805e}.bad{fill:#c54d4d}.foot{font:650 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#494b52}</style><filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="11" flood-opacity=".08"/></filter></defs>
  <rect width="1280" height="900" rx="28" fill="#faf9f6"/><text x="72" y="70" class="eye">UNIT ECONOMICS · CAMPAIGN COHORT</text><text x="72" y="117" class="title">Low CPI does not guarantee low final CAC</text><text x="72" y="151" class="sub">Follow performance from CPI to First Transaction, D90 Contribution LTV, and Payback Period</text>
  <rect x="1000" y="72" width="208" height="59" rx="14" fill="#eeeaff" stroke="#d7d0fa"/><text x="1104" y="97" text-anchor="middle" class="small">TARGET CAC</text><text x="1104" y="120" text-anchor="middle" class="head">≤ $120</text>
  <g filter="url(#s)"><rect x="118" y="200" width="1090" height="574" rx="18" fill="#fff"/></g><rect x="118" y="200" width="258" height="104" rx="18" fill="#f3f1ec"/><rect x="376" y="200" width="277" height="104" fill="#eeeaff"/><rect x="653" y="200" width="277" height="104" fill="#e7f1f7"/><path d="M930 200H1190Q1208 200 1208 218V304H930Z" fill="#e7f5ed"/>
  <text x="150" y="243" class="head">Metric</text><text x="150" y="270" class="small">Same attribution and cohort window</text><text x="514" y="240" text-anchor="middle" class="head">Campaign A</text><text x="514" y="268" text-anchor="middle" class="small">Low-cost install signal</text><text x="792" y="240" text-anchor="middle" class="head">Campaign B</text><text x="792" y="268" text-anchor="middle" class="small">Balanced traffic</text><text x="1068" y="240" text-anchor="middle" class="head">Campaign C</text><text x="1068" y="268" text-anchor="middle" class="small">Higher-intent users</text>
  <g stroke="#e3e0da" stroke-width="1.5"><path d="M118 304H1208M118 398H1208M118 492H1208M118 586H1208M118 680H1208"/><path d="M376 200V774M653 200V774M930 200V774"/></g>
  <text x="150" y="356" class="metric">CPI</text><text x="150" y="379" class="small">Cost per Install</text><text x="514" y="366" text-anchor="middle" class="value good">$3.80</text><text x="792" y="366" text-anchor="middle" class="value">$5.20</text><text x="1068" y="366" text-anchor="middle" class="value">$6.40</text>
  <text x="150" y="450" class="metric">Cost per KYC Complete</text><text x="150" y="473" class="small">Deeper user quality</text><text x="514" y="460" text-anchor="middle" class="value">$29</text><text x="792" y="460" text-anchor="middle" class="value">$26</text><text x="1068" y="460" text-anchor="middle" class="value good">$24</text>
  <text x="150" y="544" class="metric">Cost per First Transaction</text><text x="150" y="567" class="small">Media CAC in this article</text><rect x="459" y="514" width="110" height="49" rx="11" fill="#fde8e8"/><text x="514" y="547" text-anchor="middle" class="value bad">$148</text><text x="792" y="547" text-anchor="middle" class="value">$108</text><rect x="1013" y="514" width="110" height="49" rx="11" fill="#e3f4eb"/><text x="1068" y="547" text-anchor="middle" class="value good">$92</text>
  <text x="150" y="638" class="metric">D90 Contribution LTV</text><text x="150" y="661" class="small">Value contributed within 90 days</text><text x="514" y="648" text-anchor="middle" class="value">$34</text><text x="792" y="648" text-anchor="middle" class="value">$51</text><text x="1068" y="648" text-anchor="middle" class="value good">$68</text>
  <text x="150" y="728" class="metric">Payback Period</text><text x="150" y="751" class="small">Contribution LTV covers CAC</text><text x="514" y="738" text-anchor="middle" class="value bad">&gt; 15 months</text><text x="792" y="738" text-anchor="middle" class="value">8 months</text><text x="1068" y="738" text-anchor="middle" class="value good">5 months</text>
  <rect x="118" y="810" width="1090" height="55" rx="13" fill="#f0efe9"/><text x="663" y="844" text-anchor="middle" class="foot">Campaign A wins on CPI but falls behind on final CAC, D90 value, and payback speed.</text>
</svg>
