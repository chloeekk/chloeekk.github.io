<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">Event data comparison across Meta, an MMP, and an internal business system</title>
  <desc id="desc">Simulated event data for the same fintech app campaign cohort across three systems. Meta records 10,240 installs, 6,180 registrations, 2,440 KYC completions, and 1,080 first transactions. The MMP records 9,860, 5,930, 2,320, and 1,010 respectively. The internal system does not record installs and records 6,050 registrations, 2,390 KYC completions, and 1,045 first transactions. Absolute totals differ, while the direction of the funnel remains similar.</desc>
  <defs>
    <style>
      .eyebrow{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.12em;fill:#6558d6}
      .title{font:750 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#202126}
      .subtitle{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#686b73}
      .event{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#484a51}
      .event-note{font:500 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#7a7d85}
      .system{font:750 21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#282a2f}
      .system-note{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#6f727a}
      .value{font:750 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#2e3035}
      .role-label{font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.04em;fill:#777a82}
      .role{font:650 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#41434a}
      .foot{font:650 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#494b52}
      .connector{fill:none;stroke-width:3;stroke-linecap:round}
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="11" flood-color="#302d4f" flood-opacity=".09"/>
    </filter>
  </defs>

  <rect width="1280" height="900" rx="28" fill="#faf9f6"/>
  <text x="72" y="70" class="eyebrow">ONE CAMPAIGN COHORT · THREE DATA VIEWS</text>
  <text x="72" y="117" class="title">One campaign cohort, three systems, three questions</text>
  <text x="72" y="151" class="subtitle">Totals may differ; definitions, trends, and the size of each gap should remain explainable</text>

  <text x="346" y="210" text-anchor="middle" class="event">Install</text>
  <text x="346" y="232" text-anchor="middle" class="event-note">Acquisition</text>
  <text x="554" y="210" text-anchor="middle" class="event">Registration</text>
  <text x="554" y="232" text-anchor="middle" class="event-note">Account created</text>
  <text x="762" y="210" text-anchor="middle" class="event">KYC Complete</text>
  <text x="762" y="232" text-anchor="middle" class="event-note">Identity verified</text>
  <text x="970" y="210" text-anchor="middle" class="event">First Transaction</text>
  <text x="970" y="232" text-anchor="middle" class="event-note">Revenue action</text>
  <text x="1141" y="210" text-anchor="middle" class="role-label">PRIMARY USE</text>

  <g filter="url(#shadow)"><rect x="72" y="258" width="1136" height="154" rx="18" fill="#eeeaff" stroke="#d8d1fb" stroke-width="1.5"/></g>
  <circle cx="112" cy="303" r="18" fill="#6657d9"/>
  <text x="142" y="299" class="system">Meta</text>
  <text x="142" y="323" class="system-note">Ads Manager</text>
  <path d="M346 335H970" class="connector" stroke="#8d82e4"/>
  <circle cx="346" cy="335" r="43" fill="#fff" stroke="#887ce2" stroke-width="3"/>
  <circle cx="554" cy="335" r="35" fill="#fff" stroke="#887ce2" stroke-width="3"/>
  <circle cx="762" cy="335" r="27" fill="#fff" stroke="#887ce2" stroke-width="3"/>
  <circle cx="970" cy="335" r="21" fill="#fff" stroke="#887ce2" stroke-width="3"/>
  <text x="346" y="342" text-anchor="middle" class="value">10,240</text>
  <text x="554" y="342" text-anchor="middle" class="value">6,180</text>
  <text x="762" y="342" text-anchor="middle" class="value">2,440</text>
  <text x="970" y="342" text-anchor="middle" class="value">1,080</text>
  <rect x="1035" y="286" width="145" height="96" rx="13" fill="#fff" fill-opacity=".76"/>
  <text x="1054" y="316" class="role-label">PLATFORM VIEW</text>
  <text x="1054" y="344" class="role">Ad attribution</text>
  <text x="1054" y="368" class="role">Delivery optimization</text>

  <g filter="url(#shadow)"><rect x="72" y="430" width="1136" height="154" rx="18" fill="#e5f1f8" stroke="#c8dfec" stroke-width="1.5"/></g>
  <circle cx="112" cy="475" r="18" fill="#3b84aa"/>
  <text x="142" y="471" class="system">MMP</text>
  <text x="142" y="495" class="system-note">Mobile attribution</text>
  <path d="M346 507H970" class="connector" stroke="#6ba4c1"/>
  <circle cx="346" cy="507" r="42" fill="#fff" stroke="#5f9dbc" stroke-width="3"/>
  <circle cx="554" cy="507" r="34" fill="#fff" stroke="#5f9dbc" stroke-width="3"/>
  <circle cx="762" cy="507" r="26" fill="#fff" stroke="#5f9dbc" stroke-width="3"/>
  <circle cx="970" cy="507" r="20" fill="#fff" stroke="#5f9dbc" stroke-width="3"/>
  <text x="346" y="514" text-anchor="middle" class="value">9,860</text>
  <text x="554" y="514" text-anchor="middle" class="value">5,930</text>
  <text x="762" y="514" text-anchor="middle" class="value">2,320</text>
  <text x="970" y="514" text-anchor="middle" class="value">1,010</text>
  <rect x="1035" y="458" width="145" height="96" rx="13" fill="#fff" fill-opacity=".76"/>
  <text x="1054" y="488" class="role-label">CHANNEL VIEW</text>
  <text x="1054" y="516" class="role">Cross-channel</text>
  <text x="1054" y="540" class="role">attribution &amp; analysis</text>

  <g filter="url(#shadow)"><rect x="72" y="602" width="1136" height="154" rx="18" fill="#e7f5ed" stroke="#c9e4d5" stroke-width="1.5"/></g>
  <circle cx="112" cy="647" r="18" fill="#3d9469"/>
  <text x="142" y="643" class="system">Internal system</text>
  <text x="142" y="667" class="system-note">Business data</text>
  <path d="M554 679H970" class="connector" stroke="#6eb18d"/>
  <circle cx="346" cy="679" r="30" fill="#f8fcfa" stroke="#91bca5" stroke-width="2" stroke-dasharray="5 5"/>
  <circle cx="554" cy="679" r="35" fill="#fff" stroke="#5ba67e" stroke-width="3"/>
  <circle cx="762" cy="679" r="27" fill="#fff" stroke="#5ba67e" stroke-width="3"/>
  <circle cx="970" cy="679" r="21" fill="#fff" stroke="#5ba67e" stroke-width="3"/>
  <text x="346" y="686" text-anchor="middle" class="value" fill="#7a7d85">—</text>
  <text x="554" y="686" text-anchor="middle" class="value">6,050</text>
  <text x="762" y="686" text-anchor="middle" class="value">2,390</text>
  <text x="970" y="686" text-anchor="middle" class="value">1,045</text>
  <rect x="1035" y="630" width="145" height="96" rx="13" fill="#fff" fill-opacity=".76"/>
  <text x="1054" y="660" class="role-label">BUSINESS VIEW</text>
  <text x="1054" y="688" class="role">Actual status</text>
  <text x="1054" y="712" class="role">Customer value</text>

  <rect x="72" y="798" width="1136" height="62" rx="14" fill="#f0efe9"/>
  <text x="640" y="835" text-anchor="middle" class="foot">Watch whether trends align, gaps are explainable, and discrepancy ratios change suddenly.</text>
</svg>
